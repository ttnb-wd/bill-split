<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7B4DFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Bill Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EFFF;--card:#fff;--soft:#EFE9FF;--ink:#2A1B6B;--mut:#7A6FB0;--pink:#FF3D81;--vio:#7B4DFF;--sky:#00B8FF;--mint:#14D99B;--sun:#FFC21A;--org:#FF7A29;--gain:#0BA678;--loss:#E8286B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;line-height:1.5;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(60px);z-index:0;pointer-events:none;animation:float 12s ease-in-out infinite alternate}
.b1{width:320px;height:320px;background:#FF9CC2;top:-90px;left:-90px;opacity:.7}
.b2{width:300px;height:300px;background:#8FDFFF;top:38%;right:-120px;opacity:.7;animation-delay:-5s}
.b3{width:320px;height:320px;background:#FFE08A;bottom:-110px;left:10%;opacity:.8;animation-delay:-8s}
@keyframes float{to{transform:translate(50px,-40px) scale(1.2)}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:30px 18px 100px}
h1{font-weight:800;font-size:clamp(52px,16vw,84px);line-height:.95;margin:0;letter-spacing:-3px;display:flex;flex-wrap:wrap}
h1 span{display:inline-block;animation:drop .9s cubic-bezier(.3,1.6,.5,1) backwards}
h1 .sp{width:16px}
@keyframes drop{from{transform:translateY(-140px) rotate(-30deg);opacity:0}}
.tag{color:var(--mut);margin:12px 0 22px;font-size:17px;font-weight:600}
.tabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-radius:22px;padding:5px;margin-bottom:22px;box-shadow:0 10px 30px -14px rgba(123,77,255,.5)}
.tabs button{position:relative;z-index:1;border:0;background:none;color:var(--mut);font-weight:700;font-size:14px;font-family:inherit;padding:13px 2px;cursor:pointer;transition:color .25s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:48px}
.tabs button.on{color:#fff}
.ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:18px;background:linear-gradient(135deg,var(--pink),var(--vio));box-shadow:0 8px 20px -6px var(--pink);transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.card{background:var(--card);border-radius:28px;padding:18px;margin-bottom:16px;box-shadow:0 14px 34px -16px rgba(123,77,255,.45)}
.row{display:flex;gap:10px;align-items:center}
input,button,select,textarea{-webkit-tap-highlight-color:transparent}
input{width:100%;border:2.5px solid transparent;background:var(--soft);color:var(--ink);font-weight:700;font-size:17px;font-family:inherit;padding:14px 16px;border-radius:16px;outline:0;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;position:relative;z-index:2;transition:border-color .2s,background .2s;touch-action:manipulation}
input:focus{border-color:var(--vio);background:#fff;box-shadow:0 0 0 5px rgba(123,77,255,.18)}
input::placeholder{color:var(--mut);font-weight:500}
.btn{border:0;cursor:pointer;color:#fff;font-weight:800;font-size:17px;font-family:inherit;padding:14px 22px;border-radius:16px;background:linear-gradient(135deg,var(--vio),var(--pink));box-shadow:0 10px 22px -8px var(--vio);white-space:nowrap;transition:transform .2s cubic-bezier(.3,1.8,.5,1);touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:48px;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{transform:translateY(-3px) scale(1.04)}.btn:active{transform:scale(.93)}
.btn.full{width:100%;margin-top:16px;padding:17px;font-size:18px}
.btn.mint{background:linear-gradient(135deg,var(--mint),var(--sky));color:#063b2c;box-shadow:0 10px 22px -8px var(--mint)}
button:focus-visible,input:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.lbl{font-size:14px;color:var(--mut);margin:18px 0 9px;font-weight:700;display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;border:2.5px solid var(--c);background:#fff;color:var(--ink);font-weight:700;font-size:15px;font-family:inherit;padding:5px 14px 5px 5px;border-radius:99px;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.8,.5,1),background .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px}
.chip.on{background:var(--c);color:#fff;transform:scale(1.08)}
.chip:active{transform:scale(.9)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--c);flex:none}
.av img,.bigav img{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit}
.chip.on .av{background:rgba(255,255,255,.35)}
.person{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;background:var(--card);border-radius:24px;margin-bottom:10px;border-left:8px solid var(--c);box-shadow:0 10px 26px -16px rgba(123,77,255,.5)}
.person .av{width:48px;height:48px;font-size:27px}
.person b{flex:1;font-size:18px}
.x{border:0;background:var(--soft);color:var(--mut);width:34px;height:34px;border-radius:50%;cursor:pointer;font-weight:700;font-size:18px;font-family:inherit;transition:transform .25s,background .2s,color .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.x:hover{background:var(--pink);color:#fff;transform:rotate(90deg)}
.x.txt{width:auto;padding:0 12px;font-size:13px;height:28px}
.in{animation:pop .55s cubic-bezier(.3,1.6,.5,1) backwards}
.in:nth-child(2){animation-delay:.06s}.in:nth-child(3){animation-delay:.12s}.in:nth-child(4){animation-delay:.18s}.in:nth-child(5){animation-delay:.24s}.in:nth-child(n+6){animation-delay:.3s}
@keyframes pop{from{transform:scale(.6) translateY(26px);opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}
.item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:22px;margin-bottom:10px;box-shadow:0 10px 26px -16px rgba(123,77,255,.5)}
.item .m{flex:1;min-width:0}.item .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m small{color:var(--mut);font-weight:600}
.amt{font-weight:800;font-size:20px}
.bal{margin-bottom:16px}
.bal .top{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bal .top b{flex:1;font-size:17px}
.bar{height:14px;background:var(--soft);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width 1.1s cubic-bezier(.2,1.2,.4,1)}
.pos{color:var(--gain)}.neg{color:var(--loss)}
.pay{display:flex;align-items:center;gap:8px;padding:16px;border-radius:26px;margin-bottom:12px;background:var(--card);flex-wrap:wrap;box-shadow:0 14px 30px -16px rgba(123,77,255,.55)}
.pay .av{width:46px;height:46px;font-size:25px}
.flow{flex:1;min-width:60px;position:relative;height:4px;border-radius:4px;background:repeating-linear-gradient(90deg,#CFC4F5 0 8px,transparent 8px 16px)}
.flow::after{content:"";position:absolute;top:-6px;left:0;width:16px;height:16px;border-radius:50%;background:var(--sun);box-shadow:0 0 14px var(--sun);animation:go 1.6s ease-in-out infinite}
@keyframes go{from{left:0}to{left:calc(100% - 16px)}}
.pay .amt{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;font-size:18px}
.pay .btn{padding:11px 18px;font-size:15px}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-weight:700;font-size:18px}
.empty big{display:block;font-size:64px;animation:wob 2.2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(12deg) scale(1.12)}}
h2{font-size:20px;margin:28px 0 12px;font-weight:800}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:99px;font-weight:700;z-index:9;transition:transform .5s cubic-bezier(.3,1.6,.5,1);max-width:90vw}
#toast.show{transform:translate(-50%,0)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

main{padding:22px 16px calc(120px + env(safe-area-inset-bottom,0px))}
h1{font-size:clamp(44px,13vw,64px);letter-spacing:-2px}
.tag{font-size:16px;margin:8px 0 14px}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;max-width:536px;margin:0 auto;box-shadow:0 14px 40px -10px rgba(123,77,255,.6)}
.tabs button{font-size:13px;padding:14px 1px}
body.profile-screen .tabs{display:none}
body.profile-screen main{padding-bottom:40px}
#toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.hb{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.pill{display:flex;align-items:center;gap:8px;min-width:0;max-width:65%;background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--mut);box-shadow:0 8px 20px -12px rgba(123,77,255,.6)}
.pill b{color:var(--ink);letter-spacing:2px}
.pill .gn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mebtn{display:flex;align-items:center;gap:6px;border:2.5px solid var(--c,var(--vio));background:#fff;color:var(--ink);font-weight:700;font-size:15px;font-family:inherit;padding:6px 14px;border-radius:99px;cursor:pointer;min-height:44px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.code{font-weight:800;font-size:clamp(36px,12vw,52px);letter-spacing:6px;text-align:center;margin:6px 0 14px;background:linear-gradient(90deg,var(--pink),var(--vio),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-user-select:all;user-select:all}
.bigav{width:96px;height:96px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:54px;margin:0 auto 16px;transition:background .3s,transform .4s cubic-bezier(.3,1.8,.5,1);box-shadow:0 14px 30px -12px var(--c)}
.photo-actions{display:flex;justify-content:center;gap:10px;margin:-4px 0 12px}
.photo-btn{border:0;background:var(--soft);color:var(--ink);font-family:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:99px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:40px}
.photo-btn[hidden]{display:none}
.result{background:var(--soft);border-radius:22px;padding:16px;text-align:center;margin-top:16px}
.result small{display:block;color:var(--mut);font-weight:700}
.result strong{display:block;font-size:clamp(34px,10vw,48px);line-height:1.15;color:var(--vio);margin:4px 0}
.result .total{color:var(--ink);font-size:17px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pick,.sw{aspect-ratio:1;border:3px solid transparent;border-radius:18px;background:var(--soft);font-size:28px;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.8,.5,1);touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px;display:flex;align-items:center;justify-content:center}
.sw{background:var(--c)}
.grid:last-of-type{grid-template-columns:repeat(6,1fr)}
.pick.on,.sw.on{border-color:var(--ink);transform:scale(1.12)}
.pick:active,.sw:active{transform:scale(.88)}
.linkbtn{display:block;margin:10px auto 0;border:0;background:none;color:var(--mut);font-weight:700;font-size:15px;font-family:inherit;padding:12px;cursor:pointer;text-decoration:underline;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:44px}
.group-list{display:grid;gap:9px;margin-bottom:16px}
.group-link{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;border-left:8px solid var(--vio);border-radius:20px;background:var(--card);color:var(--ink);font-family:inherit;font-weight:700;font-size:16px;box-shadow:0 10px 26px -16px rgba(123,77,255,.5);cursor:pointer;text-align:left;transition:transform .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:56px}
.group-link:hover{transform:translateY(-2px)}
.group-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-link small{flex:none;color:var(--mut);letter-spacing:1.5px}
.modal-backdrop{position:fixed;inset:0;z-index:7;display:grid;place-items:center;padding:18px;background:rgba(42,27,107,.38);backdrop-filter:blur(8px)}
.modal-card{width:min(100%,520px);max-height:calc(100vh - 36px);overflow:auto;background:var(--card);border-radius:28px;padding:20px;box-shadow:0 20px 60px -18px rgba(42,27,107,.55);animation:pop .45s cubic-bezier(.3,1.6,.5,1) backwards}
.modal-card h2{margin:0 0 12px}
.friend-options{display:grid;gap:8px;max-height:30vh;overflow:auto;margin-top:12px}
.friend-option{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:2px solid var(--soft);border-radius:18px;background:var(--card);color:var(--ink);font-family:inherit;font-weight:700;font-size:15px;text-align:left;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:52px}
.friend-option.on{border-color:var(--vio);background:var(--soft)}
.friend-option span:nth-child(2){flex:1}
.friend-option small{color:var(--mut)}
.sep{text-align:center;color:var(--mut);font-weight:700;margin:14px 0}
.chip,.x{min-height:40px}
.x{min-width:40px}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<canvas id="cf"></canvas>
<main>
  <h1 id="title" aria-label="Bill Split"></h1>
  <p class="tag">Split the bill. Keep the friends. 🍜</p>
  <div id="hdr"></div>
  <nav class="tabs" id="tabs"><div class="ind" id="ind"></div>
    <button data-t="0">Calculator</button><button data-t="1">Friends</button><button data-t="2">Expenses</button><button data-t="3">Settle</button>
  </nav>
  <section id="view"></section>
</main>
<div id="toast" role="status"></div>
<script>

const COL=['#FF3D81','#7B4DFF','#00B8FF','#14D99B','#FFC21A','#FF7A29'];
const EMO=['🐯','🦊','🐼','🐸','🦄','🐙','🐵','🐰','🐻','🐶'];
const S={screen:'calculator',returnScreen:'calculator',tab:0,anim:true,mem:null,code:null,groupName:'',ownerId:null,people:[],items:[],sig:'',draft:null,pending:'',createForm:null,calc:{amount:'',people:2},form:{title:'',amt:'',payer:null,split:[]}};
const $=s=>document.querySelector(s), esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n.toFixed(2)).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const L=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const defaultProfile=()=>({name:'You',emoji:EMO[0],color:COL[0],avatar:null});
const knownGroups=()=>{const groups=L('groups');return Array.isArray(groups)?groups.filter(g=>g&&typeof g.code==='string').map(g=>({code:g.code,name:typeof g.name==='string'&&g.name.trim()?g.name.trim():`Group ${g.code}`,ownerId:g.ownerId||null})):[]};
function rememberGroup(code,name,ownerId){const groups=knownGroups().filter(g=>g.code!==code);groups.unshift({code,name:String(name||`Group ${code}`).slice(0,40),ownerId:ownerId||null});L('groups',groups)}
const P=id=>S.people.find(p=>p.id===id)||{name:'?',color:'#999',emoji:'❔',avatar:null};
const safeAvatar=a=>typeof a==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+/]+=*$/.test(a)?a:'';
const av=p=>`<span class="av" style="--c:${p.color}">${safeAvatar(p.avatar)?`<img src="${esc(safeAvatar(p.avatar))}" alt="">`:esc(p.emoji||'🙂')}</span>`;
const A=()=>S.anim?' in':'';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
$('#title').innerHTML=[...'Bill Split'].map((c,i)=>c===' '?'<span class="sp"></span>':`<span style="color:${COL[i%6]};animation-delay:${i*70}ms">${c}</span>`).join('');

async function api(p,m='GET',b){
 const r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
 const d=await r.json().catch(()=>({}));
 if(!r.ok){const e=new Error(d.error||'Something went wrong');e.status=r.status;throw e}
 return d}
async function act(fn){try{await fn();await refresh(true)}catch(e){toast(e.message)}}

/* ---- groups & profile ---- */
async function join(code,openCalculator=false){
 code=code.trim().toUpperCase();
 let group;
 try{group=await api('/g/'+code)}catch(e){toast(e.status===404?'Invite code not found':e.message);S.screen='start';render();return false}
 const pr=L('profile')||defaultProfile(),mm=L('mem')||{};
 if(!mm[code]){try{mm[code]=(await api('/g/'+code+'/members','POST',pr)).id;L('mem',mm)}catch(e){toast(e.message);S.screen='start';render();return false}}
 const savedGroup=knownGroups().find(g=>g.code===code);
 const displayName=group.name||savedGroup?.name||`Group ${code}`;
 const ownerId=group.ownerId||savedGroup?.ownerId||null;
 S.code=code;S.groupName=displayName;S.ownerId=ownerId;rememberGroup(code,displayName,ownerId);S.mem=mm[code];L('group',code);
 try{history.replaceState(null,'','?g='+code)}catch(e){}
 S.tab=openCalculator?0:1;S.anim=true;await refresh(true);S.screen='app';render();return true}
async function create(name,friends=[]){
 try{
  const d=await api('/groups','POST',{name});
  const groupName=d.name||name;
  const ownerId=d.ownerId;
  rememberGroup(d.code,groupName,ownerId);
  S.groupName=groupName;
  S.ownerId=ownerId;
  const mm=L('mem')||{};
  mm[d.code]=ownerId;
  L('mem',mm);
  S.mem=ownerId;
  const pr=L('profile')||defaultProfile();
  await api('/g/'+d.code+'/members','POST',{...pr,id:ownerId});
  S.code=d.code;
  L('group',d.code);
  try{history.replaceState(null,'','?g='+d.code)}catch(e){}
  for(const friend of friends){
   try{await api('/g/'+d.code+'/members','POST',friend)}
   catch(e){toast(`${friend.name} could not be added: ${e.message}`);break}
  }
  S.tab=1;S.anim=true;await refresh(true);S.screen='app';
  S.createForm=null;render()
 }catch(e){toast(e.message)}}
function openCreateForm(){S.createForm={name:'',friends:[],selected:[],loaded:false,loading:false,picker:false};S.screen='create';S.anim=true;render()}
function friendKey(p){return JSON.stringify([p.name,p.emoji,p.color,p.avatar||''])}
async function availableFriends(){
 const all=[],me=L('profile')||defaultProfile();let unavailable=0;
 for(const group of knownGroups()){
  let d;
  try{d=await api('/g/'+group.code)}
  catch(e){if(e.status===404){unavailable++;continue}throw e}
  if(d.name&&d.name!==group.name)rememberGroup(group.code,d.name);
  for(const m of d.members){
   const friend={name:m.name,emoji:m.emoji,color:m.color,avatar:m.avatar||null};
   if(friendKey(friend)===friendKey(me)||all.some(p=>friendKey(p)===friendKey(friend)))continue;
   all.push(friend)
  }
 }
 if(unavailable)toast('Some saved groups are no longer available');
 return all}
async function toggleFriendPicker(){
 const f=S.createForm;f.picker=!f.picker;
 if(f.picker&&!f.loaded){
  f.loading=true;render();
  try{f.friends=await availableFriends();f.loaded=true}
  catch(e){f.picker=false;toast(e.message)}
  f.loading=false
 }
 render()}
function leave(){L('group',null);S.code=null;S.groupName='';S.tab=1;S.screen='start';try{history.replaceState(null,'',location.pathname)}catch(e){}render()}
async function refresh(force){
 if(!S.code)return;
 try{const d=await api('/g/'+S.code);
  if(!d.members.some(m=>m.id===S.mem)){const mm=L('mem')||{};mm[S.code]=(await api('/g/'+S.code+'/members','POST',L('profile')||defaultProfile())).id;L('mem',mm);S.mem=mm[S.code];return refresh(true)}
  if(d.name&&d.name!==S.groupName){S.groupName=d.name;rememberGroup(S.code,S.groupName,d.ownerId)}
  if(d.ownerId){S.ownerId=d.ownerId;rememberGroup(S.code,S.groupName,d.ownerId)}
  const sig=JSON.stringify(d);S.people=d.members;S.items=d.items;
  if(force||sig!==S.sig){S.sig=sig;const a=document.activeElement;
   if(S.screen==='app'){if(!force&&a&&a.tagName==='INPUT')return;render()}}
 }catch(e){if(e.status===404){leave();toast('That group no longer exists')}}}
setInterval(()=>{if(S.screen==='app'&&!document.hidden)refresh()},4000);

/* ---- screens ---- */
function hdr(){const p=L('profile')||defaultProfile();
 $('#hdr').innerHTML=`<div class="hb">${S.screen==='app'?`<span class="pill"><span class="gn">${esc(S.groupName||'Group')}</span><b>${S.code}</b></span>`:'<span></span>'}<button class="mebtn" id="me" style="--c:${p.color}" aria-label="Edit profile">${av(p)}${esc(p.name||'')}</button></div>`;
 $('#me').onclick=()=>{S.returnScreen=S.screen;S.draft=null;S.screen='profile';S.anim=true;render()}}
function render(){
 document.body.classList.toggle('profile-screen',S.screen==='profile');
 const v=$('#view');
 if(S.screen==='profile'){$('#hdr').innerHTML='<button class="linkbtn" id="back">← Back</button>';$('#back').onclick=()=>{S.draft=null;S.screen=S.returnScreen;render()};vProfile(v)}
 else {hdr();
  $('#ind').style.transform=`translateX(${S.tab*100}%)`;
  document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('on',i===S.tab));
  if(S.screen==='create') vCreate(v);

 S.anim=false}
function setTab(t){S.tab=t;S.screen=S.code?'app':t===0?'calculator':'start';S.anim=true;render()}

function vProfile(v){
 const p=S.draft||(S.draft=Object.assign(defaultProfile(),L('profile')||{}));
 v.innerHTML=`<div class="card${A()}"><div class="bigav" style="--c:${p.color}">${safeAvatar(p.avatar)?`<img src="${esc(safeAvatar(p.avatar))}" alt="Profile photo">`:esc(p.emoji)}</div>
 <div class="photo-actions"><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" hidden><button class="photo-btn" id="upload" type="button">Upload photo</button><button class="photo-btn" id="clearphoto" type="button" ${p.avatar?'':'hidden'}>Remove photo</button></div>
 <input id="nm" placeholder="Your name" maxlength="16" autocomplete="off" value="${esc(p.name)}">
 <div class="lbl">Pick your face</div><div class="grid">${EMO.map(e=>`<button class="pick${e===p.emoji?' on':''}" data-e="${e}" aria-label="Avatar ${e}">${e}</button>`).join('')}</div>
 <div class="lbl">Pick your color</div><div class="grid">${COL.map(c=>`<button class="sw${c===p.color?' on':''}" style="--c:${c}" data-c="${c}" aria-label="Color ${c}"></button>`).join('')}</div>
 <button class="btn full" id="ps">${L('profile')?'Save profile':'Let’s go'}</button></div>`;
 const keep=()=>{p.name=$('#nm').value};
 v.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{keep();p.emoji=b.dataset.e;render()});
 v.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{keep();p.color=b.dataset.c;render()});
 $('#upload').onclick=()=>$('#photo').click();
 $('#photo').onchange=async e=>{const file=e.target.files[0];if(!file)return;
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024){toast('Choose a JPG, PNG or WebP image under 10 MB');e.target.value='';return}
  try{keep();p.avatar=await resizeAvatar(file);render()}catch(err){toast(err.message)}};
 $('#clearphoto').onclick=()=>{keep();p.avatar=null;render()};
 const save=async()=>{keep();p.name=p.name.trim();if(!p.name){shake($('#nm'));toast('Add your name');return}
  L('profile',{name:p.name,emoji:p.emoji,color:p.color,avatar:p.avatar||null});S.draft=null;
  if(S.code&&S.mem){try{await api('/g/'+S.code+'/members/'+S.mem,'PATCH',L('profile'));await refresh(true)}catch(e){toast(e.message)}S.screen='app';S.anim=true;render();return}
  const c=S.pending||L('group')||'';S.pending='';
  if(c)join(c);else{S.screen=S.returnScreen||'calculator';S.anim=true;render()}};
 $('#ps').onclick=save;$('#nm').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();save()}}}

async function resizeAvatar(file){
 const url=URL.createObjectURL(file);
 try{const img=new Image();img.src=url;await img.decode();
  const side=Math.min(img.naturalWidth,img.naturalHeight),x=(img.naturalWidth-side)/2,y=(img.naturalHeight-side)/2;
  const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;
  canvas.getContext('2d').drawImage(img,x,y,side,side,0,0,256,256);
  let data=canvas.toDataURL('image/jpeg',.78);
  if(data.length>68000)data=canvas.toDataURL('image/jpeg',.55);
  if(data.length>70000)throw new Error('Image is too detailed to upload; choose another photo');
  return data
 }finally{URL.revokeObjectURL(url)}}

function vCalculator(v){
 v.innerHTML=`<div class="card${A()}">
  <div class="lbl" style="margin-top:0">Bill total</div><input id="ctotal" type="number" inputmode="decimal" min="0" step="any" placeholder="Enter bill amount" value="${esc(S.calc.amount)}">
  <div class="lbl">Number of people</div><input id="cpeople" type="number" inputmode="numeric" min="1" max="100" step="1" value="${esc(S.calc.people)}">

  <button class="linkbtn" id="creset">Clear calculator</button>
 </div>`;
 const update=()=>{S.calc.amount=$('#ctotal').value;S.calc.people=$('#cpeople').value;
  const total=Number(S.calc.amount),people=Number(S.calc.people),valid=Number.isFinite(total)&&total>0&&Number.isInteger(people)&&people>=1&&people<=100;
  $('#cshare').textContent=valid?fmt(total/people):'0.00';
  $('#ctotal-label').textContent=valid?`${fmt(total)} total · ${people} ${people===1?'person':'people'}`:'Enter an amount and number of people'};
 $('#ctotal').oninput=update;$('#cpeople').oninput=update;
 $('#creset').onclick=()=>{S.calc={amount:'',people:2};render()};
 update()}

function vStart(v){
 const groups=knownGroups();
 v.innerHTML=`<div class="card${A()}"><div class="empty" style="padding:6px"><big>🍜</big>Start a group, then invite your friends</div><button class="btn full" id="cr">Create a group</button>
 <div class="sep">or join with an invite code</div><div class="row"><input id="jc" placeholder="Invite code" maxlength="6" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase;letter-spacing:3px"><button class="btn mint" id="jn">Join</button></div></div>`+
 `<h2>Your groups</h2>${groups.length?`<div class="group-list">${groups.map(g=>`<button class="group-link" type="button" data-g="${esc(g.code)}"><span>${esc(g.name)}</span><small>${esc(g.code)}</small></button>`).join('')}</div>`:'<div class="empty" style="padding:18px"><big>👥</big>Your groups will appear here</div>'}`;
 $('#cr').onclick=openCreateForm;
 v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>join(b.dataset.g));
 const go=()=>{const c=$('#jc').value.trim();if(c.length<4){shake($('#jc'));return}join(c)};
 $('#jn').onclick=go;$('#jc').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}}}

function vCreate(v){
 const f=S.createForm;
 if(!f){S.screen='start';return render()}
 const selected=f.selected.map(p=>`<span class="chip on" style="--c:${p.color}">${av(p)}${esc(p.name)}</span>`).join('');
 const picker=f.loading?'<div class="empty" style="padding:18px">Loading friends…</div>'
  :f.loaded&&!f.friends.length?'<div class="empty" style="padding:18px">No saved friends yet. Join or create a group first.</div>'
  :f.loaded?`<div class="friend-options">${f.friends.map((p,i)=>{const on=f.selected.some(x=>friendKey(x)===friendKey(p));
    return `<button type="button" class="friend-option${on?' on':''}" data-friend="${i}" aria-pressed="${on}">${av(p)}<span>${esc(p.name)}</span><small>${on?'Added':'Add'}</small></button>`}).join('')}</div>`:'';
 v.innerHTML=`<div class="modal-backdrop"><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="create-title">
  <button class="linkbtn" id="cancel-create">← Back</button><h2 id="create-title">Create a group</h2>
  <div class="lbl" style="margin-top:0">Group name</div><input id="group-name" placeholder="e.g. Weekend dinner" maxlength="40" autocomplete="off" value="${esc(f.name)}">
  <div class="lbl">Friends</div><button class="btn mint full" id="add-friends" type="button">${f.picker?'Done':'Add friends'}</button>
  ${selected?`<div class="chips" style="margin-top:12px">${selected}</div>`:''}
  ${f.picker?picker:''}
  <div class="lbl">You can invite others with a group link after creating.</div>
  <button class="btn full" id="finish-create" type="button">Create group</button>
 </div></div>`;
 $('#cancel-create').onclick=()=>{S.createForm=null;S.screen='start';render()};
 $('#group-name').oninput=e=>{f.name=e.target.value};
 $('#add-friends').onclick=toggleFriendPicker;
 v.querySelectorAll('[data-friend]').forEach(b=>b.onclick=()=>{
  const person=f.friends[Number(b.dataset.friend)],key=friendKey(person);
  f.selected=f.selected.some(p=>friendKey(p)===key)?f.selected.filter(p=>friendKey(p)!==key):[...f.selected,person];
  render()});
 $('#finish-create').onclick=()=>{
  f.name=$('#group-name').value.trim();
  if(!f.name){shake($('#group-name'));toast('Enter a group name');return}
  create(f.name,f.selected)}
}

function vPeople(v){
 const link=location.origin+location.pathname+'?g='+S.code;
 const copy=()=>{(navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast('Invite link copied'),()=>toast(link))};
 const copyCode=()=>{(navigator.clipboard?navigator.clipboard.writeText(S.code):Promise.reject()).then(()=>toast('Invite code copied ✓'),()=>toast(S.code))};
 v.innerHTML=`<div class="card${A()}"><div class="lbl" style="margin:0;justify-content:center">Invite friends with this code</div><div class="code" id="code-display" style="cursor:pointer" title="Click to copy code">${S.code}</div>
 <div class="row"><button class="btn" id="sh" style="flex:1">Share invite</button><button class="btn mint" id="cp" style="flex:1">Copy link</button></div></div>
 <h2>In this group</h2>`+S.people.map(p=>{
  const isYou=p.id===S.mem;
  const isOwner=p.id===S.ownerId;
  let badge='';
  if(isYou&&isOwner)badge=' <small style="color:var(--vio)">👑 Owner (you)</small>';
  else if(isOwner)badge=' <small style="color:var(--vio)">👑 Owner</small>';
  else if(isYou)badge=' <small style="color:var(--mut)">(you)</small>';
  const canRemove=!isYou&&!isOwner;
  return `<div class="person${A()}" style="--c:${p.color}">${av(p)}<b>${esc(p.name)}${badge}</b>${canRemove?`<button class="x" data-d="${p.id}" aria-label="Remove ${esc(p.name)}">×</button>`:''}</div>`}).join('')+
 `<div class="card"><div class="lbl" style="margin-top:0">Friend not on their phone? Add them</div><div class="row"><input id="pn" placeholder="Friend’s name" maxlength="16" autocomplete="off"><button class="btn" id="pa">Add</button></div></div>
 <button class="linkbtn" id="sw">Switch group</button>`;
 $('#code-display').onclick=copyCode;
 $('#cp').onclick=copy;
 $('#sh').onclick=()=>{if(navigator.share)navigator.share({title:'Bill Split',text:'Join my group on Bill Split',url:link}).catch(()=>{});else copy()};
 $('#sw').onclick=leave;
 const add=()=>{const el=$('#pn'),n=el.value.trim();if(!n){shake(el);return}const k=S.people.length;
  act(()=>api('/g/'+S.code+'/members','POST',{name:n,emoji:EMO[(k*3+n.length)%EMO.length],color:COL[k%6]}))};
 $('#pa').onclick=add;$('#pn').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};
 v.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const id=b.dataset.d;
  if(S.items.some(i=>i.payer===id||i.from===id||i.to===id||(i.split||[]).includes(id))){shake(b.closest('.person'));toast('Already in an expense, can’t remove');return}
  act(()=>api('/g/'+S.code+'/members/'+id,'DELETE'))})}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2300)}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}

/* math in cents; each expense is split evenly, leftover cents go to the first people */
function nets(){const n={};S.people.forEach(p=>n[p.id]=0);
 S.items.forEach(i=>{
  if(i.pay){if(i.from in n)n[i.from]+=i.amt;if(i.to in n)n[i.to]-=i.amt;return}
  const c=Math.round(i.amt*100),k=i.split.length;if(!k||!(i.payer in n))return;
  n[i.payer]+=c;const b=Math.floor(c/k);let r=c-b*k;
  i.split.forEach(id=>{if(id in n){n[id]-=b+(r>0?1:0)}if(r>0)r--})});
 return n}
function transfers(n){const d=[],c=[];for(const id in n){if(n[id]<0)d.push([id,-n[id]]);else if(n[id]>0)c.push([id,n[id]])}
 d.sort((a,b)=>b[1]-a[1]);c.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;
 while(i<d.length&&j<c.length){const m=Math.min(d[i][1],c[j][1]);out.push({from:d[i][0],to:c[j][0],amt:m});d[i][1]-=m;c[j][1]-=m;if(!d[i][1])i++;if(!c[j][1])j++}
 return out}

function count(el,to){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,4);el.textContent=fmt(to*e);if(k<1)requestAnimationFrame(f)})(t0)}

function confetti(){const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.7,vx:(Math.random()-.5)*18,vy:-Math.random()*20-6,s:Math.random()*8+5,c:COL[Math.random()*6|0],r:Math.random()*6,vr:Math.random()*.4-.2}));
 (function f(){x.clearRect(0,0,c.width,c.height);let a=0;ps.forEach(p=>{p.vy+=.5;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y<innerHeight+20)a++;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});if(a)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

function vSpend(v){
 if(S.people.length<2){v.innerHTML=`<div class="empty"><big>🧑‍🤝‍🧑</big>Add at least 2 friends first</div>`;return}
 const f=S.form;if(!S.people.some(p=>p.id===f.payer))f.payer=S.mem;f.split=f.split.filter(id=>S.people.some(p=>p.id===id));
 const chips=(on,k)=>S.people.map(p=>`<button class="chip${on(p.id)?' on':''}" style="--c:${p.color}" data-${k}="${p.id}">${av(p)}${esc(p.name)}</button>`).join('');
 const hist=S.items.filter(i=>!i.pay).slice().reverse();
 v.innerHTML=`<div class="card${A()}">
  <input id="ti" placeholder="What was it for? (dinner, taxi…)" maxlength="30" value="${esc(f.title)}">
  <input id="am" type="number" inputmode="decimal" min="0" step="any" placeholder="Total amount" style="margin-top:10px" value="${esc(f.amt)}">
  <div class="lbl">Who paid?</div><div class="chips">${chips(id=>id===f.payer,'p')}</div>
  <div class="lbl">Split between <button class="x txt" id="all">Everyone</button></div><div class="chips">${chips(id=>f.split.includes(id),'s')}</div>
  <button class="btn full" id="sv">Add expense</button></div>`+
 (hist.length?`<h2>History</h2>`+hist.map(i=>`<div class="item${A()}">${av(P(i.payer))}<div class="m"><b>${esc(i.title)}</b><small>${esc(P(i.payer).name)} paid · split ${i.split.length} way${i.split.length>1?'s':''}</small></div><span class="amt">${fmt(i.amt)}</span><button class="x" data-r="${i.id}" aria-label="Delete expense">×</button></div>`).join(''):'');
 const keep=()=>{f.title=$('#ti').value;f.amt=$('#am').value};
 $('#ti').oninput=$('#am').oninput=keep;
 v.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{keep();f.payer=b.dataset.p;render()});
 v.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{keep();const id=b.dataset.s;f.split=f.split.includes(id)?f.split.filter(x=>x!==id):[...f.split,id];render()});
 $('#all').onclick=()=>{keep();f.split=S.people.map(p=>p.id);render()};
 $('#sv').onclick=()=>{keep();const a=parseFloat(f.amt);
  if(!f.title.trim()||!(a>0)||!f.split.length){shake($('#sv'));toast('Add a title, an amount and who splits it');return}
  const body={kind:'expense',title:f.title.trim(),amt:a,payer:f.payer,split:f.split.slice()};
  S.form={title:'',amt:'',payer:f.payer,split:[]};act(()=>api('/g/'+S.code+'/expenses','POST',body)).then(()=>toast('Expense added ✨'))};
 v.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>act(()=>api('/g/'+S.code+'/expenses/'+b.dataset.r,'DELETE')))}

function vSettle(v){
 if(!S.items.length){v.innerHTML=`<div class="empty"><big>🧾</big>No expenses yet</div>`;return}
 const n=nets(),t=transfers(n),mx=Math.max(...Object.values(n).map(Math.abs),1);
 v.innerHTML=`<div class="card${A()}">`+S.people.map(p=>{const c=n[p.id]||0;
  return `<div class="bal"><div class="top">${av(p)}<b>${esc(p.name)}</b><span class="amt ${c>0?'pos':c<0?'neg':''}">${c>0?'+':c<0?'−':''}<span data-n="${Math.abs(c)/100}">0.00</span></span></div><div class="bar"><i data-w="${Math.abs(c)/mx*100}" style="background:${c>=0?'var(--mint)':'var(--pink)'}"></i></div></div>`}).join('')+`</div>`+
 (t.length?`<h2>Who pays whom</h2>`+t.map((x,k)=>`<div class="pay${A()}">${av(P(x.from))}<div class="flow"></div>${av(P(x.to))}<div class="amt"><span>${esc(P(x.from).name)} pays ${esc(P(x.to).name)} <b data-n="${x.amt/100}">0.00</b></span><button class="btn mint" data-k="${k}">Paid ✓</button></div></div>`).join(''):`<div class="empty"><big>🎉</big>All settled. Nobody owes anything!</div>`);
 v.querySelectorAll('[data-n]').forEach(e=>count(e,+e.dataset.n));
 setTimeout(()=>v.querySelectorAll('[data-w]').forEach(e=>e.style.width=Math.max(+e.dataset.w,3)+'%'),60);
 v.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const x=t[b.dataset.k];
  confetti();toast('Settled 🎉');
  const card=b.closest('.pay');card.style.transition='transform .5s,opacity .5s';card.style.transform='translateX(110%) rotate(8deg)';card.style.opacity='0';
  setTimeout(()=>act(()=>api('/g/'+S.code+'/expenses','POST',{kind:'pay',from:x.from,to:x.to,amt:x.amt/100})),480)})}


document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(+b.dataset.t));
(async()=>{
 const q=new URLSearchParams(location.search).get('g'),c=(q||L('group')||'').toUpperCase();
 if(!L('profile'))L('profile',defaultProfile());
 if(c){
  const savedGroup=knownGroups().find(g=>g.code===c);
  if(savedGroup&&savedGroup.ownerId)S.ownerId=savedGroup.ownerId;
  await join(c,true);
 }else{S.screen='calculator';S.tab=0;render()}})();
</script>
